<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecciones · Jobby</title>
<link rel="stylesheet" href="shared.css">
<style>
  .tab-head { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .p-tab { background: transparent; border: 0; padding: 14px 22px; font-family: var(--sans); font-size: 0.98rem; color: var(--stone); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .p-tab.active { color: var(--ink); border-bottom-color: var(--ochre); font-weight: 500; }

  /* Forecast chart */
  .forecast-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; margin-bottom: 20px; }
  .forecast-card h3 { font-size: 1.2rem; margin-bottom: 4px; }
  .forecast-card .sub { color: var(--stone); font-size: 0.88rem; font-family: var(--mono); margin-bottom: 20px; }
  .forecast-chart { height: 300px; width: 100%; }

  /* Contracts list */
  .contract-row { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 160px 140px 100px 80px; gap: 20px; align-items: center; }
  .contract-row.projected { border-left: 3px solid var(--amber); }
  .contract-row.active { border-left: 3px solid var(--success); }
  .contract-info .name { font-size: 1rem; color: var(--ink); margin-bottom: 4px; }
  .contract-info .client { font-size: 0.85rem; color: var(--stone); font-family: var(--mono); }
  .contract-amount { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .contract-amount .big { font-size: 1.05rem; color: var(--ink); font-weight: 500; }
  .contract-amount .small { font-size: 0.78rem; color: var(--stone); margin-top: 2px; }
  .contract-period { font-family: var(--mono); font-size: 0.82rem; color: var(--slate); }
  .contract-prob { font-family: var(--mono); text-align: center; }
  .contract-prob .ring { width: 40px; height: 40px; margin: 0 auto; }

  /* Budget */
  .budget-row { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 22px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 160px 120px 1fr 120px; gap: 20px; align-items: center; }
  .budget-cat { font-size: 1rem; color: var(--ink); }
  .budget-type { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 999px; display: inline-block; }
  .budget-type.income { background: rgba(47, 125, 79, 0.12); color: var(--success); }
  .budget-type.expense { background: rgba(184, 98, 46, 0.12); color: var(--ochre); }
  .budget-amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
  .budget-progress { display: flex; flex-direction: column; gap: 6px; }
  .budget-progress .pbar { height: 6px; }
  .budget-progress .bl { font-family: var(--mono); font-size: 0.78rem; color: var(--stone); display: flex; justify-content: space-between; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .mini-kpi { background: var(--paper); border: 1px solid var(--line); padding: 16px 18px; border-radius: var(--r-md); }
  .mini-kpi.hero { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .mini-kpi .l { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stone); margin-bottom: 6px; }
  .mini-kpi.hero .l { color: var(--amber); }
  .mini-kpi .v { font-family: var(--serif); font-size: 1.5rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mini-kpi.hero .v { color: var(--cream); }

  @media (max-width: 900px) {
    .contract-row, .budget-row { grid-template-columns: 1fr 1fr; gap: 12px; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="title">
        <div class="eyebrow">Planeación financiera</div>
        <h1 style="margin-top: 8px;">Proyecciones</h1>
        <p>Analiza contratos comprometidos, oportunidades y cumplimiento del presupuesto.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="newContract()" id="newBtn">+ Nuevo contrato</button>
      </div>
    </div>

    <div class="tab-head">
      <button class="p-tab active" data-t="contracts">Contratos</button>
      <button class="p-tab" data-t="budget">Presupuesto</button>
      <button class="p-tab" data-t="flujo">Flujo mensual</button>
    </div>

    <div id="content"></div>
  </main>
</div>

<script src="app.js"></script>
<script>
(function () {
  const { Store, Calc, fmt, mountSidebar, toast, Modal, can } = Jobby;
  mountSidebar('proyecciones');

  let tab = 'contracts';

  document.querySelectorAll('.p-tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.p-tab').forEach(t => t.classList.remove('active'));
    b.classList.add('active');
    tab = b.dataset.t;
    const btn = document.getElementById('newBtn');
    if (tab === 'contracts') { btn.textContent = '+ Nuevo contrato'; btn.onclick = newContract; btn.style.display = ''; }
    else if (tab === 'budget') { btn.textContent = '+ Nueva partida'; btn.onclick = newBudget; btn.style.display = ''; }
    else { btn.style.display = 'none'; }
    render();
  }));

  function render() {
    if (tab === 'contracts') renderContracts();
    else if (tab === 'budget') renderBudget();
    else renderFlujoMensual();
  }

  function renderContracts() {
    const contracts = Store.all('contracts');
    const active = contracts.filter(c => c.status === 'active');
    const projected = contracts.filter(c => c.status === 'projected');

    const activeMonthly = active.reduce((s, c) => s + c.monthlyAmount, 0);
    const projectedMonthly = projected.reduce((s, c) => s + c.monthlyAmount * (c.probability / 100), 0);
    const forecast6 = Calc.forecast(6);
    const total6 = forecast6.reduce((s, f) => s + f.committed + f.projected, 0);

    let html = `
      <div class="kpi-row">
        <div class="mini-kpi hero">
          <div class="l">Proyección 6 meses</div>
          <div class="v">${fmt.mxn(total6)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Mensual comprometido</div>
          <div class="v" style="color: var(--success);">${fmt.mxn(activeMonthly)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Mensual proyectado</div>
          <div class="v" style="color: var(--ochre);">${fmt.mxn(projectedMonthly)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Contratos</div>
          <div class="v">${active.length}<span style="font-size:0.8rem;color:var(--stone);font-family:var(--mono);"> activos · ${projected.length} prospectos</span></div>
        </div>
      </div>

      <div class="forecast-card">
        <h3>Proyección de ingresos (6 meses)</h3>
        <div class="sub">Contratos activos + oportunidades ponderadas por probabilidad de cierre</div>
        <div id="forecastChart"></div>
      </div>

      <h3 style="margin-bottom: 14px; font-size: 1.1rem;">Contratos activos (${active.length})</h3>`;

    html += active.map(c => contractRow(c)).join('');
    if (active.length === 0) html += '<p style="color:var(--stone);font-size:0.9rem;padding:20px 0;">No hay contratos activos.</p>';

    html += `<h3 style="margin: 32px 0 14px; font-size: 1.1rem;">Oportunidades / proyectados (${projected.length})</h3>`;
    html += projected.map(c => contractRow(c)).join('');
    if (projected.length === 0) html += '<p style="color:var(--stone);font-size:0.9rem;padding:20px 0;">No hay oportunidades en pipeline.</p>';

    document.getElementById('content').innerHTML = html;

    renderForecastChart();
  }

  function contractRow(c) {
    const client = Store.find('clients', c.clientId);
    const totalValue = c.monthlyAmount * monthsBetween(c.startDate, c.endDate);
    return `<div class="contract-row ${c.status}" onclick="editContract('${c.id}')" style="cursor: pointer;">
      <div class="contract-info">
        <div class="name">${c.name}</div>
        <div class="client">${client?.name || 'Sin cliente asignado'}</div>
      </div>
      <div class="contract-amount">
        <div class="big">${fmt.mxn(c.monthlyAmount)}</div>
        <div class="small">mensual · total ${fmt.mxnCompact(totalValue)}</div>
      </div>
      <div class="contract-period">${fmt.dateShort(c.startDate)} → ${fmt.dateShort(c.endDate)}</div>
      <div class="contract-prob">
        ${c.status === 'projected' ? probRing(c.probability) : '<span class="badge-active" style="padding: 4px 10px; border-radius: 999px; font-family: var(--mono); font-size: 0.72rem;">Activo</span>'}
      </div>
      <div style="text-align:right;">
        <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 0.78rem;" onclick="event.stopPropagation();editContract('${c.id}')">Editar</button>
      </div>
    </div>`;
  }

  function probRing(pct) {
    const r = 16, c = 2 * Math.PI * r;
    const off = c * (1 - pct / 100);
    const color = pct >= 70 ? '#2F7D4F' : pct >= 40 ? '#D99050' : '#A93A2B';
    return `<svg class="ring" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="#E8DECA" stroke-width="3"/>
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 20 20)" stroke-linecap="round"/>
      <text x="20" y="24" text-anchor="middle" font-family="Geist Mono" font-size="10" fill="#0E1F1A" font-weight="500">${pct}%</text>
    </svg>`;
  }

  function monthsBetween(a, b) {
    const da = new Date(a), db = new Date(b);
    return (db.getFullYear() - da.getFullYear()) * 12 + (db.getMonth() - da.getMonth()) + 1;
  }

  function renderForecastChart() {
    const data = Calc.forecast(6);
    const W = 800, H = 260;
    const max = Math.max(...data.map(d => d.committed + d.projected)) * 1.2 || 1;
    const barW = (W - 80) / data.length - 10;
    const yFor = v => H - 40 - (v / max) * (H - 60);
    const xFor = i => 50 + i * (barW + 10);

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:300px;">`;
    svg += `<g stroke="#D9D0B8" stroke-width="1" stroke-dasharray="2 4">`;
    for (let i = 0; i <= 4; i++) { const y = 20 + i * (H - 60) / 4; svg += `<line x1="50" y1="${y}" x2="${W}" y2="${y}"/>`; }
    svg += `</g><g font-family="Geist Mono" font-size="10" fill="#6B6B5E">`;
    for (let i = 0; i <= 4; i++) { const v = max - (i * max / 4); svg += `<text x="10" y="${25 + i * (H - 60) / 4}">$${(v / 1000).toFixed(0)}K</text>`; }
    svg += `</g>`;

    data.forEach((d, i) => {
      const yC = yFor(d.committed);
      const yP = yFor(d.committed + d.projected);
      svg += `<rect x="${xFor(i)}" y="${yC}" width="${barW}" height="${H - 40 - yC}" fill="#0F5132" rx="3"/>`;
      svg += `<rect x="${xFor(i)}" y="${yP}" width="${barW}" height="${yC - yP}" fill="#D99050" rx="3"/>`;
      svg += `<text x="${xFor(i) + barW / 2}" y="${H - 10}" text-anchor="middle" font-family="Geist Mono" font-size="10" fill="#6B6B5E">${d.label}</text>`;
      if (d.committed + d.projected > 0) {
        svg += `<text x="${xFor(i) + barW / 2}" y="${yP - 6}" text-anchor="middle" font-family="Geist Mono" font-size="9" fill="#0E1F1A" font-weight="500">$${((d.committed + d.projected) / 1000).toFixed(0)}K</text>`;
      }
    });

    svg += `<g font-family="Geist" font-size="10" fill="#3D3D35">`;
    svg += `<rect x="${W - 220}" y="14" width="10" height="10" fill="#0F5132"/><text x="${W - 205}" y="23">Comprometido</text>`;
    svg += `<rect x="${W - 115}" y="14" width="10" height="10" fill="#D99050"/><text x="${W - 100}" y="23">Proyectado</text>`;
    svg += `</g>`;
    svg += `</svg>`;

    document.getElementById('forecastChart').innerHTML = svg;
  }

  function renderBudget() {
    const summary = Calc.budgetSummary();
    const budgets = Store.all('budgets');

    const incomeBar = Math.min(100, (summary.actualIncome / summary.income) * 100);
    const expenseBar = Math.min(100, (summary.actualExpense / summary.expense) * 100);

    let html = `
      <div class="kpi-row">
        <div class="mini-kpi hero">
          <div class="l">Flujo neto proyectado</div>
          <div class="v">${fmt.mxn(summary.net)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Ingresos presupuestados</div>
          <div class="v" style="color: var(--success);">${fmt.mxnCompact(summary.income)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Gastos presupuestados</div>
          <div class="v" style="color: var(--ochre);">${fmt.mxnCompact(summary.expense)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Flujo neto real</div>
          <div class="v" style="color: ${summary.actualNet >= summary.net ? 'var(--success)' : 'var(--danger)'}">${fmt.mxn(summary.actualNet)}</div>
        </div>
      </div>

      <div class="forecast-card">
        <h3>Desempeño del presupuesto mensual</h3>
        <div class="sub">Comparación de lo presupuestado vs. lo ejecutado este mes</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;">
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span style="font-family:var(--mono);font-size:0.8rem;color:var(--stone);">INGRESOS</span>
              <span style="font-family:var(--mono);font-size:0.8rem;">${fmt.mxnCompact(summary.actualIncome)} / ${fmt.mxnCompact(summary.income)}</span>
            </div>
            <div class="pbar" style="height: 10px;"><div class="pbar-fill" style="width: ${incomeBar}%; background: var(--success);"></div></div>
            <div style="font-family:var(--mono);font-size:0.75rem;color:var(--stone);margin-top:4px;">${incomeBar.toFixed(0)}% del presupuesto ejecutado</div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span style="font-family:var(--mono);font-size:0.8rem;color:var(--stone);">GASTOS</span>
              <span style="font-family:var(--mono);font-size:0.8rem;">${fmt.mxnCompact(summary.actualExpense)} / ${fmt.mxnCompact(summary.expense)}</span>
            </div>
            <div class="pbar" style="height: 10px;"><div class="pbar-fill ${expenseBar > 100 ? 'over' : expenseBar > 80 ? 'warn' : ''}" style="width: ${Math.min(100, expenseBar)}%;"></div></div>
            <div style="font-family:var(--mono);font-size:0.75rem;color:var(--stone);margin-top:4px;">${expenseBar.toFixed(0)}% del presupuesto ejecutado</div>
          </div>
        </div>
      </div>

      <h3 style="margin-bottom: 14px; font-size: 1.1rem;">Partidas presupuestales (${budgets.length})</h3>`;

    html += budgets.map(b => {
      const pct = b.monthly > 0 ? (b.actual / b.monthly) * 100 : 0;
      const barClass = b.type === 'expense' && pct > 100 ? 'over' : (b.type === 'expense' && pct > 85) ? 'warn' : '';
      return `<div class="budget-row" onclick="editBudget('${b.id}')" style="cursor:pointer;">
        <div class="budget-cat">
          <div style="margin-bottom:6px;">${b.category}</div>
          <span class="budget-type ${b.type}">${b.type === 'income' ? 'Ingreso' : 'Gasto'}</span>
        </div>
        <div class="budget-amt">${fmt.mxn(b.monthly)}<div style="font-size:0.72rem;color:var(--stone);margin-top:2px;">mensual</div></div>
        <div class="budget-amt">${fmt.mxn(b.actual)}<div style="font-size:0.72rem;color:var(--stone);margin-top:2px;">real</div></div>
        <div class="budget-progress">
          <div class="pbar"><div class="pbar-fill ${barClass}" style="width: ${Math.min(100, pct)}%; ${b.type === 'income' ? 'background: var(--success);' : ''}"></div></div>
          <div class="bl"><span>${pct.toFixed(0)}% ejecutado</span><span>${b.type === 'expense' && pct > 100 ? 'Sobregiro' : pct >= 100 ? 'Completado' : 'En curso'}</span></div>
        </div>
        <div style="text-align:right;">
          <button class="btn btn-ghost" style="padding:4px 10px;font-size:0.78rem;" onclick="event.stopPropagation();editBudget('${b.id}')">Editar</button>
        </div>
      </div>`;
    }).join('');

    document.getElementById('content').innerHTML = html;
  }

  function renderFlujoMensual() {
    const today = new Date();
    const budgets = Store.all('budgets');
    const totalExpense = budgets.filter(b => b.type === 'expense').reduce((s, b) => s + b.monthly, 0);

    const data = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(today.getFullYear(), today.getMonth() + i, 1);
      const ym = d.toISOString().slice(0, 7);
      let committed = 0, projected = 0;
      Store.all('contracts').forEach(k => {
        if (ym >= k.startDate.slice(0, 7) && ym <= k.endDate.slice(0, 7)) {
          if (k.status === 'active')    committed += k.monthlyAmount;
          if (k.status === 'projected') projected += k.monthlyAmount * (k.probability / 100);
        }
      });
      data.push({ d, committed, projected, expense: totalExpense });
    }

    const sum12c = data.reduce((s, m) => s + m.committed, 0);
    const sum12p = data.reduce((s, m) => s + m.projected, 0);
    const sum12e = data.reduce((s, m) => s + m.expense, 0);
    const netOpt = sum12c + sum12p - sum12e;

    const rows = data.map((m, idx) => {
      const netC   = m.committed - m.expense;
      const netOp  = m.committed + m.projected - m.expense;
      const coverPct = m.expense > 0 ? Math.min(100, ((m.committed + m.projected) / m.expense) * 100) : 100;
      const netColor = netC >= 0 ? 'var(--success)' : netOp >= 0 ? 'var(--ochre)' : 'var(--danger)';
      const isNow  = idx === 0;
      const label  = m.d.toLocaleDateString('es-MX', { month: 'short', year: '2-digit' }).toUpperCase().replace('.', '');
      return `<tr style="border-bottom:1px solid var(--line);${isNow ? 'background:rgba(15,81,50,0.04);' : ''}">
        <td style="padding:13px 0;font-family:var(--mono);font-size:0.88rem;color:var(--ink);font-weight:${isNow ? 600 : 400};">
          ${isNow ? '→ ' : ''}${label}
        </td>
        <td style="text-align:right;padding:13px 8px;font-family:var(--mono);font-size:0.85rem;color:var(--success);">${fmt.mxnCompact(m.committed)}</td>
        <td style="text-align:right;padding:13px 8px;font-family:var(--mono);font-size:0.85rem;color:var(--ochre);">+${fmt.mxnCompact(m.projected)}</td>
        <td style="text-align:right;padding:13px 8px;font-family:var(--mono);font-size:0.85rem;color:var(--stone);">${fmt.mxnCompact(m.expense)}</td>
        <td style="text-align:right;padding:13px 0;font-family:var(--mono);font-size:0.85rem;color:${netColor};font-weight:500;">${fmt.mxnCompact(netC)}</td>
        <td style="padding:13px 0 13px 20px;min-width:110px;">
          <div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${coverPct}%;background:${netColor};border-radius:3px;"></div>
          </div>
          <div style="font-family:var(--mono);font-size:0.68rem;color:var(--stone);margin-top:3px;">${coverPct.toFixed(0)}% cubierto</div>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('content').innerHTML = `
      <div class="kpi-row">
        <div class="mini-kpi hero">
          <div class="l">Comprometido 12 meses</div>
          <div class="v">${fmt.mxnCompact(sum12c)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Proyectado adicional</div>
          <div class="v" style="color:var(--ochre);">+${fmt.mxnCompact(sum12p)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Gastos presupuestados</div>
          <div class="v" style="color:var(--danger);">${fmt.mxnCompact(sum12e)}</div>
        </div>
        <div class="mini-kpi">
          <div class="l">Flujo neto optimista</div>
          <div class="v" style="color:${netOpt >= 0 ? 'var(--success)' : 'var(--danger)'};">${fmt.mxnCompact(netOpt)}</div>
        </div>
      </div>

      <div class="forecast-card">
        <h3>Flujo mes a mes — próximos 12 meses</h3>
        <div class="sub">Ingresos de contratos vs. gastos presupuestados. El flujo neto usa solo los contratos activos (conservador).</div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;min-width:600px;">
            <thead>
              <tr style="border-bottom:2px solid var(--line);">
                <th style="text-align:left;padding:10px 0;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);">Mes</th>
                <th style="text-align:right;padding:10px 8px;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--success);">Comprometido</th>
                <th style="text-align:right;padding:10px 8px;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ochre);">Proyectado</th>
                <th style="text-align:right;padding:10px 8px;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);">Gastos</th>
                <th style="text-align:right;padding:10px 0;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);">Flujo neto</th>
                <th style="padding:10px 0 10px 20px;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);">Cobertura</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-size:0.78rem;color:var(--stone);">
          <div><span style="color:var(--success);">●</span> Flujo positivo con contratos activos</div>
          <div><span style="color:var(--ochre);">●</span> Positivo solo si se cierran prospectos</div>
          <div><span style="color:var(--danger);">●</span> Déficit proyectado</div>
        </div>
      </div>`;
  }

  window.newContract = () => {
    const c = { id: '', name: '', clientId: Store.all('clients')[0]?.id || '', monthlyAmount: 50000, startDate: new Date().toISOString().slice(0, 10), endDate: Jobby.addDays(new Date().toISOString().slice(0, 10), 365), status: 'projected', probability: 50, notes: '' };
    openContractModal(c);
  };

  window.editContract = (id) => {
    openContractModal(Store.find('contracts', id));
  };

  function openContractModal(c) {
    const isNew = !c.id;
    Modal.open(`
      <div class="modal-head">
        <div><h3>${isNew ? 'Nuevo contrato' : 'Editar contrato'}</h3><div class="sub">${isNew ? 'Registra un contrato activo u oportunidad' : c.name}</div></div>
        <button class="modal-close" onclick="Jobby.Modal.close()">✕</button>
      </div>
      <div class="form-row full">
        <div class="form-field"><label>Nombre del contrato</label><input type="text" id="kName" value="${c.name}" placeholder="Ej. Maquila mensual 2026"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Cliente</label>
          <select id="kClient">
            ${Store.all('clients').map(cl => `<option value="${cl.id}" ${cl.id === c.clientId ? 'selected' : ''}>${cl.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-field"><label>Monto mensual MXN</label><input type="number" id="kAmount" value="${c.monthlyAmount}" min="0" step="100"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Inicio</label><input type="date" id="kStart" value="${c.startDate}"></div>
        <div class="form-field"><label>Fin</label><input type="date" id="kEnd" value="${c.endDate}"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Status</label>
          <select id="kStatus">
            <option value="active" ${c.status === 'active' ? 'selected' : ''}>Activo — ya firmado</option>
            <option value="projected" ${c.status === 'projected' ? 'selected' : ''}>Proyectado — oportunidad</option>
          </select>
        </div>
        <div class="form-field"><label>Probabilidad de cierre (%)</label><input type="number" id="kProb" value="${c.probability}" min="0" max="100" step="10"></div>
      </div>
      <div class="form-row full">
        <div class="form-field"><label>Notas</label><textarea id="kNotes">${c.notes || ''}</textarea></div>
      </div>
      <div class="modal-foot">
        ${!isNew ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);margin-right:auto;" onclick="deleteContract('${c.id}')">Eliminar</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="Jobby.Modal.close()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="saveContract('${c.id}')">Guardar</button>
      </div>`);
  }

  window.saveContract = (id) => {
    const data = {
      name: document.getElementById('kName').value.trim(),
      clientId: document.getElementById('kClient').value,
      monthlyAmount: +document.getElementById('kAmount').value,
      startDate: document.getElementById('kStart').value,
      endDate: document.getElementById('kEnd').value,
      status: document.getElementById('kStatus').value,
      probability: +document.getElementById('kProb').value,
      notes: document.getElementById('kNotes').value.trim()
    };
    if (!data.name) { toast('Nombre es requerido', 'error'); return; }
    if (data.status === 'active') data.probability = 100;

    if (id) {
      Store.update('contracts', id, data);
      Store.logActivity('Editó contrato', data.name);
      toast('Contrato actualizado');
    } else {
      Store.add('contracts', data);
      Store.logActivity('Creó contrato', data.name);
      toast('Contrato creado');
    }
    Modal.close();
    render();
  };

  window.deleteContract = (id) => {
    const c = Store.find('contracts', id);
    if (confirm(`¿Eliminar contrato "${c.name}"?`)) {
      Store.remove('contracts', id);
      Store.logActivity('Eliminó contrato', c.name);
      Modal.close();
      toast('Contrato eliminado', 'error');
      render();
    }
  };

  window.newBudget = () => {
    openBudgetModal({ id: '', category: '', type: 'expense', period: String(new Date().getFullYear()), monthly: 50000, actual: 0 });
  };

  window.editBudget = (id) => {
    openBudgetModal(Store.find('budgets', id));
  };

  function openBudgetModal(b) {
    const isNew = !b.id;
    Modal.open(`
      <div class="modal-head">
        <div><h3>${isNew ? 'Nueva partida' : 'Editar partida'}</h3><div class="sub">Partida presupuestal mensual</div></div>
        <button class="modal-close" onclick="Jobby.Modal.close()">✕</button>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Categoría</label><input type="text" id="bCat" value="${b.category}" placeholder="Ej. Marketing"></div>
        <div class="form-field"><label>Tipo</label>
          <select id="bType"><option value="income" ${b.type === 'income' ? 'selected' : ''}>Ingreso</option>
            <option value="expense" ${b.type === 'expense' ? 'selected' : ''}>Gasto</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Monto mensual presupuestado MXN</label><input type="number" id="bMonth" value="${b.monthly}" min="0"></div>
        <div class="form-field"><label>Monto ejecutado real MXN</label><input type="number" id="bActual" value="${b.actual}" min="0"></div>
      </div>
      <div class="modal-foot">
        ${!isNew ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);margin-right:auto;" onclick="deleteBudget('${b.id}')">Eliminar</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="Jobby.Modal.close()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="saveBudget('${b.id}')">Guardar</button>
      </div>`);
  }

  window.saveBudget = (id) => {
    const data = {
      category: document.getElementById('bCat').value.trim(),
      type: document.getElementById('bType').value,
      period: String(new Date().getFullYear()),
      monthly: +document.getElementById('bMonth').value,
      actual: +document.getElementById('bActual').value
    };
    if (!data.category) { toast('Categoría es requerida', 'error'); return; }

    if (id) { Store.update('budgets', id, data); toast('Partida actualizada'); }
    else { Store.add('budgets', data); toast('Partida creada'); }
    Modal.close();
    render();
  };

  window.deleteBudget = (id) => {
    const b = Store.find('budgets', id);
    if (confirm(`¿Eliminar partida "${b.category}"?`)) {
      Store.remove('budgets', id);
      Modal.close();
      toast('Partida eliminada', 'error');
      render();
    }
  };

  render();
})();
</script>
<script src="demo-aviso.js"></script>
</body>
</html>
